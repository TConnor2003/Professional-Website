<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Quiz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>
<div class="app-wrap">

  <!-- ══════════ LOADING SCREEN ══════════ -->
  <div class="screen active" id="loadingScreen">
    <div class="wordmark">
      <div class="wordmark-eyebrow">Harry Potter</div>
      <div class="wordmark-title">Chapter <em>Quiz</em></div>
      <div class="wordmark-divider"></div>
    </div>

    <div class="card">
      <div class="loading-inner">
        <div class="spinner-wrap"><div class="spinner-ring"></div></div>

        <div class="loading-title">Opening the books…</div>

        <div class="loading-book" id="loadingBook">
          Summoning the library
        </div>

        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>

        <div class="book-dots" id="bookDots">
          <div class="book-dot" id="dot0"></div>
          <div class="book-dot" id="dot1"></div>
          <div class="book-dot" id="dot2"></div>
          <div class="book-dot" id="dot3"></div>
          <div class="book-dot" id="dot4"></div>
          <div class="book-dot" id="dot5"></div>
          <div class="book-dot" id="dot6"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════ ERROR SCREEN ══════════ -->
  <div class="screen" id="errorScreen">
    <div class="wordmark">
      <div class="wordmark-eyebrow">Harry Potter</div>
      <div class="wordmark-title">Chapter <em>Oracle</em></div>
      <div class="wordmark-divider"></div>
    </div>

    <div class="card">
      <div class="error-card">
        <div class="error-icon">📚</div>

        <div class="error-title">Books not found</div>

        <div class="error-msg" id="errorMsg">
          Could not load the EPUB files.
        </div>

        <button class="btn btn-primary" onclick="initLoad()">
          Try Again
        </button>
      </div>
    </div>
  </div>

  <!-- ══════════ QUIZ SCREEN ══════════ -->
  <div class="screen" id="quizScreen">
    <div class="quiz-header">
      <div class="score-wrap">
        <span class="score-num" id="scoreDisplay">0</span>
        <span class="score-lbl">Score</span>
      </div>

      <div class="hs-wrap">
        <span class="hs-num" id="hsDisplay">0</span>
        <span class="hs-lbl">Best</span>
      </div>
    </div>

    <div class="passage-label">Passage</div>

    <div class="passage-card" id="passageCard"></div>

    <div class="stage-label" id="stageLabel">
      <span class="stage-badge" id="stageBadge">Step 1</span>
      <span id="stageText">
        Which book is this passage from?
      </span>
    </div>

    <div id="choicesArea"></div>

    <div class="feedback-bar" id="feedbackBar"></div>
  </div>

  <!-- ══════════ GAME OVER SCREEN ══════════ -->
  <div class="screen" id="gameoverScreen">
    <div class="wordmark">
      <div class="wordmark-eyebrow">Harry Potter</div>
      <div class="wordmark-title">Chapter <em>Oracle</em></div>
      <div class="wordmark-divider"></div>
    </div>

    <div class="card">
      <div class="go-inner">
        <div class="go-eyebrow">Game Over</div>

        <span class="go-score" id="goScore">0</span>

        <div class="go-score-lbl">
          chapters correctly identified
        </div>

        <div class="go-record" id="goRecord" style="display:none">
          ✦ New High Score
        </div>

        <div class="go-context" id="goContext"></div>

        <div class="go-sep"></div>

        <div class="go-btns">
          <button class="btn btn-primary" onclick="restartGame()">
            Play Again
          </button>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
